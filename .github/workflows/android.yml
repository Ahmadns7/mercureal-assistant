name: android-debug

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK components (platform 34, build-tools, NDK 27, CMake 3.22.1)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Fetch native deps (whisper.cpp, llama.cpp)
        run: bash scripts/setup_native.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "MERCUREAL_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "MERCUREAL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MERCUREAL_KEY_ALIAS=$KEY_ALIAS"
              echo "MERCUREAL_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing enabled"
          else
            echo "MERCUREAL_UNSIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "Release signing secrets missing or incomplete; building unsigned APK"
          fi

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          if [[ -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            echo "Release APK built unsigned"
          elif [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          else
            echo "Release APK not found" >&2
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mercureal-assistant-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mercureal-assistant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
